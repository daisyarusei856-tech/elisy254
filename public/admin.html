<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELISY254 Admin</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="main" style="margin-left:0"><header class="top"><strong>ELISY254 ADMIN</strong><a href="/">Back to site</a></header><main class="content"><div id="login" class="panel" style="max-width:450px;margin:auto"><h1>Admin Login</h1><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="primary" onclick="login()">Sign in</button><p id="err" class="muted"></p></div>
<div id="dash" class="hidden"><div class="section"><h1>Free Bot Manager</h1><button class="action" onclick="openBot()">+ Add Free Bot</button></div><div id="list" class="botadmin"></div></div></main></div>
<div id="modal" class="modal hidden"></div>
<script>
async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});if(r.ok){loginBox();load()}else err.textContent=(await r.json()).error}
function loginBox(){document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden')}
async function load(){let r=await fetch('/api/admin/bots');if(!r.ok)return;let a=await r.json();list.innerHTML=a.map(b=>`<div class="panel"><div class="circle-preview" style="background:${b.color}">${b.name.slice(0,1).toUpperCase()}</div><h3>${esc(b.name)}</h3><p>${esc(b.description)}</p><small>${b.active?'ACTIVE':'HIDDEN'} · ${b.original_name||'No file'}</small><div class="actions" style="margin-top:12px"><button class="action" onclick='openBot(${JSON.stringify(b)})'>Edit</button><button class="action" onclick="del(${b.id})">Delete</button>${b.filename?`<a class="action" href="/api/admin/bots/${b.id}/file">File</a>`:''}</div></div>`).join('')||'<div class="panel">No bots yet.</div>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]) )}
function openBot(b={}){modal.className='modal';modal.innerHTML=`<div class="modalbox"><h2>${b.id?'Edit':'Add'} Free Bot</h2><form id="form" enctype="multipart/form-data"><div class="field"><label>Name</label><input name="name" required value="${esc(b.name)}"></div><div class="field"><label>Description</label><textarea name="description">${esc(b.description)}</textarea></div><div class="field"><label>Image URL (optional)</label><input name="image_url" value="${esc(b.image_url)}"></div><div class="field"><label>Circle colour</label><input name="color" type="color" value="${b.color||'#b9ff3d'}"></div><div class="field"><label>Bot file</label><input name="file" type="file" accept=".xml,.json,.bot"></div><div class="field"><label><input name="active" type="checkbox" value="1" ${b.active!==0?'checked':''}> Visible on Free Bots</label></div><button class="primary">${b.id?'Save changes':'Upload bot'}</button></form></div>`;form.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin/bots'+(b.id?'/'+b.id:''),{method:b.id?'PUT':'POST',body:new FormData(form)});if(r.ok){modal.className='modal hidden';load()}else alert((await r.json()).error)}}
async function del(id){if(!confirm('Delete this bot?'))return;let r=await fetch('/api/admin/bots/'+id,{method:'DELETE'});if(r.ok)load()}
</script></body></html>
